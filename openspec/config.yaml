schema: spec-driven

context: |
  Language: russian
  All artifacts must be written in russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: AI-buddy — прототип ИИ-наставника для стажёров Авито (кейс Hack&Change 2026).
  Основной пользователь — стажёр; дополнительные роли — наставник (buddy), руководитель, HR BP.
  Стек: backend Go, PostgreSQL, Redis; frontend React + TypeScript (TanStack, Zustand, Zod);
  Docker. LLM не выбрана — только через абстракцию провайдера и переменные окружения.
  Корпоративные сервисы (отсутствия, командировки, найм, увольнения, согласия, бенефиты,
  чек-лист новичка) — только имитации, данные синтетические.
  Общие правила проекта — AGENTS.md в корне репозитория.

rules:
  proposal:
    - Указывай, какой сценарий стажёра закрывает изменение и какую рутину наставника снимает
    - Явно перечисляй, что вне области изменения
  specs:
    - Для каждого действия агента опиши требуемые права и поведение при отказе в доступе
    - Опиши поведение при сбое или таймауте LLM и внешнего сервиса (интерфейс не блокируется)
    - Сценарии в формате WHEN/THEN должны быть проверяемы автотестами
  design:
    - Внешние зависимости (LLM, сервисы, БД) — за интерфейсами, с фейками для тестов
    - Действия агента — инструменты в MCP-стиле с явной схемой входа и выхода
  tasks:
    - Каждая задача реализации включает написание тестов; покрытие прикладного кода > 80%
    - Задачи не включают git commit, push или создание PR — это делает человек

operations:
  apply:
    guidance:
      - Не выполняй git commit / git push / PR — по завершении предложи текст коммита человеку
  archive:
    guidance:
      - Не коммить результат архивации — это делает человек
