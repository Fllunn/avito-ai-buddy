# Одноразовый проект для тестов-доказательств ревью безопасности.
# Запуск только с уникальным именем проекта: docker compose -p secreview-<id> -f ... ;
# основной стенд ai-buddy и его тома не затрагиваются. Пароли синтетические.
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: synthetic-secreview-admin
      API_DB_PASSWORD: synthetic-secreview-api
      MOCKS_DB_PASSWORD: synthetic-secreview-mocks
    volumes:
      - ${COPY_DIR}/infra/postgres/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d buddy_mocks']
      interval: 1s
      timeout: 2s
      retries: 60
  go:
    image: golang:1.27.0-alpine
    working_dir: /src
    environment:
      TEST_API_DATABASE_URL: postgres://buddy_api:synthetic-secreview-api@postgres:5432/buddy_api?sslmode=disable
      TEST_MOCKS_DATABASE_URL: postgres://buddy_mocks:synthetic-secreview-mocks@postgres:5432/buddy_mocks?sslmode=disable
      CGO_ENABLED: "0"
    volumes:
      - ${COPY_DIR}:/src
      - gomod:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  gomod:
