server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Inherited by every location below, including proxied /api/ and /demo/docs/.
    # 'unsafe-inline' styles: React style attributes and the document page <style>.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /ui-healthz {
        access_log off;
        default_type text/plain;
        return 200 'alive\n';
    }

    location /demo/docs/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
