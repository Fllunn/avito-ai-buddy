server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /ui-healthz {
        access_log off;
        default_type text/plain;
        return 200 'alive\n';
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
