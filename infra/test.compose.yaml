services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: synthetic-test-admin
      API_DB_PASSWORD: synthetic-test-api
      MOCKS_DB_PASSWORD: synthetic-test-mocks
    volumes:
      - test_postgres:/var/lib/postgresql/data
      - ./postgres/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    ports:
      - 127.0.0.1::5432
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d buddy_mocks']
      interval: 1s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4.1-alpine
    ports:
      - 127.0.0.1::6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 2s
      retries: 30

volumes:
  test_postgres:
