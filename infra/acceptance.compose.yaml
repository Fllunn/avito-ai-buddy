services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  api:
    ports: !override
      - 127.0.0.1:18080:8080
    environment:
      ALLOWED_ORIGIN: http://localhost:15173
      LLM_PROVIDER: fake
      LLM_MODEL: ""
      OPENROUTER_API_KEY: ""
  mocks:
    ports: !override
      - 127.0.0.1:18081:8080
    environment:
      DEMO_PANEL_ORIGIN: http://localhost:18081
  frontend:
    ports: !override
      - 127.0.0.1:15173:80
