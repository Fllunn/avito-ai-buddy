services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  api:
    ports: !override ["127.0.0.1:28080:8080"]
    environment:
      ALLOWED_ORIGIN: http://localhost:25173
      LLM_PROVIDER: fake
      OPENROUTER_API_KEY: ""
  mocks:
    ports: !override ["127.0.0.1:28081:8080"]
    environment:
      DEMO_PANEL_ORIGIN: http://localhost:28081
  frontend:
    ports: !override ["127.0.0.1:25173:80"]
